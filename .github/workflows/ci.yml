name: BuildMate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── ① 后端环境检查（Python）──────────────────────────
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 环境自检
        run: python scripts/verify_env.py

  # ── ② 前端构建（Vue3）────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: frontend/static

  # ── ③ Docker 镜像构建 ─────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t buildmate:ci .

      - name: 镜像冒烟（启动后探活 /health）
        run: |
          docker run -d --name buildmate-smoke -p 8000:8000 buildmate:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs buildmate-smoke
          exit 1
