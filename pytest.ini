[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --basetemp=.pytest_tmp
markers =
    v1_legacy: compatibility tests for the retired v1 API surface
    external_sample: tests that require a real external drawing or service
    golden: deterministic golden baseline/regression tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
