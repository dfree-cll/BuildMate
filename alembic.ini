# Alembic config (enterprise: versioned migrations replace startup patching)
# NOTE: keep this file ASCII-only -- alembic reads it with locale encoding
# (GBK on zh-CN Windows) and fails on non-ASCII comments.
# The real connection URL is injected by migrations/env.py from backend.config
# (DATABASE_URL); the placeholder below exists for alembic CLI compatibility.
[alembic]
script_location = migrations
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
